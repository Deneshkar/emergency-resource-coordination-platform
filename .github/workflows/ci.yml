name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ./backend-tests/ERCP.Api.Tests.csproj

      - name: Build
        run: dotnet build ./backend-tests/ERCP.Api.Tests.csproj --no-restore

      - name: Run tests
        run: dotnet test ./backend-tests/ERCP.Api.Tests.csproj --no-build --verbosity normal