<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#fff5f5"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.15" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#bae6fd" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="0.9" cy="0.85" r="0.45">
      <stop offset="0" stop-color="#fecaca" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fecaca" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#dbeafe" stroke-width="1"/>
    </pattern>
    <g id="pin">
      <path d="M0-26c-9 0-16 7-16 16 0 12 16 26 16 26s16-14 16-26c0-9-7-16-16-16z"/>
      <circle cx="0" cy="-10" r="6" fill="#fff"/>
    </g>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glowBlue)"/>
  <rect width="1600" height="1000" fill="url(#glowRed)"/>

  <!-- city blocks -->
  <g fill="#e0edff" opacity="0.8">
    <rect x="96" y="624" width="96" height="144" rx="8"/>
    <rect x="240" y="576" width="144" height="96" rx="8"/>
    <rect x="1248" y="96" width="144" height="96" rx="8"/>
    <rect x="1392" y="240" width="96" height="144" rx="8"/>
    <rect x="1104" y="768" width="192" height="96" rx="8"/>
    <rect x="624" y="96" width="96" height="96" rx="8"/>
  </g>

  <!-- route lines -->
  <g fill="none" stroke-linecap="round" stroke-width="4">
    <path d="M140 300 C 400 220, 560 480, 820 420 S 1240 260, 1460 360" stroke="#7dd3fc" stroke-dasharray="2 14"/>
    <path d="M200 860 C 520 760, 760 900, 1020 740 S 1360 620, 1500 700" stroke="#fca5a5" stroke-dasharray="2 14"/>
    <path d="M820 420 L 1020 740" stroke="#a5b4fc" stroke-dasharray="2 14"/>
  </g>

  <!-- pulse rings -->
  <g fill="none">
    <circle cx="820" cy="420" r="38" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="820" cy="420" r="70" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="2"/>
    <circle cx="1020" cy="740" r="36" stroke="#ef4444" stroke-opacity="0.3" stroke-width="2"/>
    <circle cx="1020" cy="740" r="64" stroke="#ef4444" stroke-opacity="0.12" stroke-width="2"/>
  </g>

  <!-- pins -->
  <use href="#pin" x="140" y="300" fill="#0ea5e9"/>
  <use href="#pin" x="820" y="420" fill="#2563eb"/>
  <use href="#pin" x="1460" y="360" fill="#10b981"/>
  <use href="#pin" x="200" y="860" fill="#f59e0b"/>
  <use href="#pin" x="1020" y="740" fill="#ef4444"/>
  <use href="#pin" x="1500" y="700" fill="#8b5cf6"/>
</svg>
